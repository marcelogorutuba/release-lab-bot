name: Go Tests

# Nothing ran the Go suite on a PR before this: test/e2e sat non-compiling from
# EVO-558 to EVO-2180 without a single red check. Redis is a service container
# because the repository tests need a real one.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: go build + go test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee go-test.log

      # The Redis-backed tests skip themselves when Redis is unreachable; that is a test
      # that did not run.
      - name: Fail on skipped tests
        run: |
          if grep -E '^[[:space:]]*--- SKIP' go-test.log; then
            echo "::error::Skipped tests count as failures (listed above)."
            exit 1
          fi
